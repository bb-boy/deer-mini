name: Free tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deer-mini-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEER_MINI_DATABASE_PATH: ${{ runner.temp }}/deer-mini-ci.db
      DEER_MINI_DATA_ROOT: ${{ runner.temp }}/deer-mini-ci-users
      DEER_MINI_MEMORY_ENABLED: "false"
      DEER_MINI_BASH_ENABLED: "false"
      RUN_DOCKER_SANDBOX_TEST: "0"
      RUN_LIVE_AGENT_TEST: "0"
      RUN_NATIVE_TOOLS_LIVE_TEST: "0"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression tests (no real model or Docker)
        run: python -m pytest tests/app --ignore=tests/app/model/test_factory.py -q

  frontend:
    name: Frontend / typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
