# Include inside the existing server listening on 5174.
# Tailscale Serve already proxies HTTPS :10000 to this server.
location = /ai {
    absolute_redirect off;
    return 308 /ai/;
}

location ^~ /ai/api/ {
    proxy_pass http://127.0.0.1:8005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store" always;
}

location ^~ /ai/assets/ {
    root /var/www/deer-mini/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /ai/ {
    root /var/www/deer-mini/current;
    try_files $uri $uri/ /ai/index.html;
    add_header Cache-Control "no-store" always;
}
