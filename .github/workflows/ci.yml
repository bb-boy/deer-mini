name: Free tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deer-mini-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEER_MINI_MEMORY_ENABLED: "false"
      DEER_MINI_BASH_ENABLED: "false"
      RUN_DOCKER_SANDBOX_TEST: "0"
      RUN_LIVE_AGENT_TEST: "0"
      RUN_NATIVE_TOOLS_LIVE_TEST: "0"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Configure temporary test storage
        run: |
          echo "DEER_MINI_DATABASE_PATH=$RUNNER_TEMP/deer-mini-ci.db" >> "$GITHUB_ENV"
          echo "DEER_MINI_DATA_ROOT=$RUNNER_TEMP/deer-mini-ci-users" >> "$GITHUB_ENV"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression tests (no real model or Docker)
        run: python -m pytest tests/app --ignore=tests/app/model/test_factory.py -q
      - name: Smoke-test FastAPI startup (no model calls)
        run: |
          mkdir -p "$DEER_MINI_DATA_ROOT"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8005 > "$RUNNER_TEMP/deer-mini-api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for n in {1..40}; do
            if curl -fsS http://127.0.0.1:8005/openapi.json -o "$RUNNER_TEMP/openapi.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FastAPI failed to start"
            cat "$RUNNER_TEMP/deer-mini-api.log"
            exit 1
          fi
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/openapi.json")); assert p["info"]["title"] == "deer_mini API"'
          echo "FastAPI startup: OK"


  frontend:
    name: Frontend / typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Smoke-test Vite startup (no backend or model calls)
        run: |
          pnpm dev -- --host 127.0.0.1 --port 5175 --strictPort > "$RUNNER_TEMP/deer-mini-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for n in {1..40}; do
            if curl -fsS http://127.0.0.1:5175/ -o "$RUNNER_TEMP/index.html"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vite failed to start"
            cat "$RUNNER_TEMP/deer-mini-web.log"
            exit 1
          fi
          grep -q 'id="root"' "$RUNNER_TEMP/index.html"
          echo "Vite startup: OK"
